<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roséa Boutique | Iniciar sesión</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>

<body>

    <header>
        <h1>🎀Roséa Boutique🎀</h1>
        <p>Inicia sesión</p>
    </header>

    <nav>
        <a href="index.html">Inicio</a>
        <a href="coleccion.html">Colección</a>
        <a href="contacto.html">Contacto</a>
    </nav>

    <main>
        <section class="form-checkout">
            <h3>Iniciar sesión</h3>
            <form id="form-login">
                <div class="grupo-formulario">
                    <label for="login-email">Correo electrónico</label>
                    <input id="login-email" type="email" required>
                </div>
                <div class="grupo-formulario">
                    <label for="login-password">Contraseña</label>
                    <input id="login-password" type="password" required>
                </div>
                <button class="boton" type="submit">Entrar</button>
            </form>
            <p style="margin-top:12px;">¿No tienes cuenta? <a href="registro.html">Regístrate</a></p>
        </section>
    </main>

    <footer>
        <p>© 2026 Roséa Boutique · Hecho con amor</p>
    </footer>

    <script src="js/script.js"></script>
</body>

</html>

<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roséa Boutique | Registro</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>

<body>

    <header>
        <h1>🎀Roséa Boutique🎀</h1>
        <p>Crear cuenta</p>
    </header>

    <nav>
        <a href="index.html">Inicio</a>
        <a href="coleccion.html">Colección</a>
        <a href="contacto.html">Contacto</a>
    </nav>

    <main>
        <section class="form-checkout">
            <h3>Registro</h3>
            <form id="form-registro">
                <div class="grupo-formulario">
                    <label for="reg-nombre">Nombre</label>
                    <input id="reg-nombre" type="text" required>
                </div>
                <div class="grupo-formulario">
                    <label for="reg-email">Correo electrónico</label>
                    <input id="reg-email" type="email" required>
                </div>
                <div class="grupo-formulario">
                    <label for="reg-password">Contraseña</label>
                    <input id="reg-password" type="password" required>
                </div>
                <div class="grupo-formulario">
                    <label for="reg-confirm-password">Confirmar contraseña</label>
                    <input id="reg-confirm-password" type="password" required>
                </div>
                <button class="boton" type="submit">Crear cuenta</button>
            </form>
            <p style="margin-top:12px;">¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a></p>
        </section>
    </main>

    <footer>
        <p>© 2026 Roséa Boutique · Hecho con amor</p>
    </footer>

    <script src="js/script.js"></script>
</body>

</html>
